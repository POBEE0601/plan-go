services:
  - type: web
    name: plan-go-api
    runtime: node
    plan: free
    region: singapore
    # production 설치에서 tsc가 빠지지 않도록 devDependency 포함
    buildCommand: npm install --include=dev && npm run build -w server
    startCommand: node server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
