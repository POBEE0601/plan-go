<html lang="ko">
  <head>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <meta
      name="description"
      content="함께 계획하고, 영원히 기록하는 여행 - plan-go"
    />
    <meta property="og:title" content="plan-go" />
    <meta
      property="og:description"
      content="함께 계획하고, 영원히 기록하는 여행"
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="plan-go" />
    <meta
      name="twitter:description"
      content="함께 계획하고, 영원히 기록하는 여행"
    />
    <meta name="twitter:image" content="/og-image.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>plan-go</title>
    <script>
      // 2026-09-04 첫 페인트 전에 테마 적용 (깜빡임 방지)
      try {
        var t = localStorage.getItem('plan-go-theme');
        var dark =
          t === 'dark' ||
          (t !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
